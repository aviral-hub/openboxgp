<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin & Mentor Studio — Openbox</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <script src="shared.js"></script>
    <style>
        :root { --background: #f8fafc; --foreground: #0f172a; --muted-bg: #f1f5f9; --muted-text: #475569; --card: #ffffff; }
        .dark { --background: #0a0a0c; --foreground: #f8fafc; --muted-bg: #111115; --muted-text: #94a3b8; --card: #111115; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: var(--background); color: var(--muted-text); }
        .heading-font { font-family: 'Space Grotesk', sans-serif; }
    </style>
</head>
<body class="min-h-screen pb-16">

    <header class="max-w-6xl mx-auto mt-4 px-4">
        <div class="h-16 px-5 rounded-2xl bg-[var(--card)] border border-slate-200 dark:border-white/10 flex items-center justify-between">
            <div class="flex items-center gap-4">
                <a href="index.html" class="heading-font font-bold text-[var(--foreground)] text-lg">Openbox<span class="text-blue-500">.</span></a>
                <span id="role-title" class="text-xs font-bold text-amber-500">Operations Studio</span>
            </div>
            <div class="flex items-center gap-3">
                <a href="portal.html" class="text-xs font-bold text-blue-500 hover:underline">Student View ↗</a>
                <button id="theme-toggle" class="p-2 rounded-xl bg-[var(--muted-bg)] text-xs cursor-pointer"><i class="fa-solid fa-circle-half-stroke"></i></button>
                <button onclick="logoutUser()" class="px-3 py-1.5 rounded-xl bg-red-500/10 text-red-400 text-xs font-bold cursor-pointer">Logout</button>
            </div>
        </div>
    </header>

    <main class="max-w-6xl mx-auto px-4 pt-8">
        <div class="flex flex-wrap items-center justify-between gap-4 mb-6">
            <div class="flex gap-2">
                <button onclick="showTab('reviews')" id="btn-reviews" class="px-4 py-2 rounded-xl text-xs font-bold bg-blue-600 text-white cursor-pointer">1. Task Reviews & Remarks</button>
                <button onclick="showTab('builder')" id="btn-builder" class="px-4 py-2 rounded-xl text-xs font-bold bg-[var(--card)] border border-slate-200 dark:border-white/10 cursor-pointer">2. Add Course / Video / Task</button>
                <button onclick="showTab('users')" id="btn-users" class="hidden px-4 py-2 rounded-xl text-xs font-bold bg-[var(--card)] border border-slate-200 dark:border-white/10 cursor-pointer">3. Manage Roles (Admin)</button>
            </div>
            <button onclick="syncStudio()" class="px-4 py-2 rounded-xl text-xs font-bold bg-emerald-600 text-white cursor-pointer"><i class="fa-solid fa-rotate mr-1"></i> Sync Sheet</button>
        </div>

        <p id="status" class="text-xs text-blue-500 font-semibold mb-4"></p>

        <!-- TAB 1: REVIEWS -->
        <div id="tab-reviews" class="overflow-x-auto rounded-2xl border border-slate-200 dark:border-white/10 bg-[var(--card)]">
            <table class="w-full text-left text-xs">
                <thead class="bg-[var(--muted-bg)] text-[var(--foreground)] uppercase font-bold">
                    <tr><th class="p-4">Student</th><th class="p-4">Task</th><th class="p-4">Link</th><th class="p-4">Mentor Remark</th><th class="p-4">Action</th></tr>
                </thead>
                <tbody id="tbody-subs" class="divide-y divide-slate-200 dark:divide-white/5"></tbody>
            </table>
        </div>

        <!-- TAB 2: BUILDER -->
        <div id="tab-builder" class="hidden grid grid-cols-1 lg:grid-cols-2 gap-6">
            <form onsubmit="addCourse(event)" class="p-6 rounded-2xl bg-[var(--card)] border border-slate-200 dark:border-white/10 space-y-3">
                <h3 class="heading-font font-bold text-[var(--foreground)]">Create New Course / Internship</h3>
                <input type="text" id="c-title" placeholder="Course Title" required class="w-full px-3 py-2 text-sm rounded-xl bg-[var(--muted-bg)] border border-slate-200 dark:border-white/10 text-[var(--foreground)]" />
                <div class="grid grid-cols-2 gap-2">
                    <select id="c-cat" class="px-3 py-2 text-sm rounded-xl bg-[var(--muted-bg)] border border-slate-200 dark:border-white/10 text-[var(--foreground)]">
                        <option value="Internship">Internship</option>
                        <option value="Development">Development</option>
                        <option value="Analytics">Analytics</option>
                    </select>
                    <input type="text" id="c-stack" placeholder="React, Node.js, SQL" required class="px-3 py-2 text-sm rounded-xl bg-[var(--muted-bg)] border border-slate-200 dark:border-white/10 text-[var(--foreground)]" />
                </div>
                <textarea id="c-desc" rows="2" placeholder="Description..." required class="w-full px-3 py-2 text-sm rounded-xl bg-[var(--muted-bg)] border border-slate-200 dark:border-white/10 text-[var(--foreground)]"></textarea>
                <label class="flex items-center gap-2 text-xs"><input type="checkbox" id="c-intern" checked> Task-Based Internship (Certificate)</label>
                <button type="submit" class="w-full py-2.5 rounded-xl text-xs font-bold bg-blue-600 text-white cursor-pointer">Publish Track</button>
            </form>

            <form onsubmit="addLesson(event)" class="p-6 rounded-2xl bg-[var(--card)] border border-slate-200 dark:border-white/10 space-y-3">
                <h3 class="heading-font font-bold text-[var(--foreground)]">Add Video Lesson</h3>
                <select id="l-course" required class="course-sel w-full px-3 py-2 text-sm rounded-xl bg-[var(--muted-bg)] border border-slate-200 dark:border-white/10 text-[var(--foreground)]"></select>
                <input type="text" id="l-title" placeholder="Lesson Title" required class="w-full px-3 py-2 text-sm rounded-xl bg-[var(--muted-bg)] border border-slate-200 dark:border-white/10 text-[var(--foreground)]" />
                <input type="text" id="l-video" placeholder="YouTube URL or Video ID" required class="w-full px-3 py-2 text-sm rounded-xl bg-[var(--muted-bg)] border border-slate-200 dark:border-white/10 text-[var(--foreground)]" />
                <input type="url" id="l-res" placeholder="Optional GitHub/Docs Link" class="w-full px-3 py-2 text-sm rounded-xl bg-[var(--muted-bg)] border border-slate-200 dark:border-white/10 text-[var(--foreground)]" />
                <textarea id="l-desc" rows="2" placeholder="Lesson summary..." required class="w-full px-3 py-2 text-sm rounded-xl bg-[var(--muted-bg)] border border-slate-200 dark:border-white/10 text-[var(--foreground)]"></textarea>
                <button type="submit" class="w-full py-2.5 rounded-xl text-xs font-bold bg-blue-600 text-white cursor-pointer">Add Video</button>
            </form>

            <form onsubmit="addTask(event)" class="p-6 rounded-2xl bg-[var(--card)] border border-slate-200 dark:border-white/10 space-y-3">
                <h3 class="heading-font font-bold text-[var(--foreground)]">Add Practical Task</h3>
                <select id="t-course" required class="course-sel w-full px-3 py-2 text-sm rounded-xl bg-[var(--muted-bg)] border border-slate-200 dark:border-white/10 text-[var(--foreground)]"></select>
                <input type="text" id="t-title" placeholder="Task Title" required class="w-full px-3 py-2 text-sm rounded-xl bg-[var(--muted-bg)] border border-slate-200 dark:border-white/10 text-[var(--foreground)]" />
                <input type="text" id="t-dead" placeholder="Week 1 Milestone" required class="w-full px-3 py-2 text-sm rounded-xl bg-[var(--muted-bg)] border border-slate-200 dark:border-white/10 text-[var(--foreground)]" />
                <textarea id="t-inst" rows="2" placeholder="Task instructions..." required class="w-full px-3 py-2 text-sm rounded-xl bg-[var(--muted-bg)] border border-slate-200 dark:border-white/10 text-[var(--foreground)]"></textarea>
                <button type="submit" class="w-full py-2.5 rounded-xl text-xs font-bold bg-emerald-600 text-white cursor-pointer">Assign Task</button>
            </form>
        </div>

        <!-- TAB 3: ADMIN USERS -->
        <div id="tab-users" class="hidden overflow-x-auto rounded-2xl border border-slate-200 dark:border-white/10 bg-[var(--card)]">
            <table class="w-full text-left text-xs">
                <thead class="bg-[var(--muted-bg)] text-[var(--foreground)] uppercase font-bold">
                    <tr><th class="p-4">Name</th><th class="p-4">Email</th><th class="p-4">Role</th></tr>
                </thead>
                <tbody id="tbody-users" class="divide-y divide-slate-200 dark:divide-white/5"></tbody>
            </table>
        </div>
    </main>

    <script>
        if (!isStaff()) window.location.href = "login.html";

        document.addEventListener("DOMContentLoaded", () => {
            document.getElementById("role-title").textContent = `${getNormalizedRole()} Studio`;
            if (isAdmin()) document.getElementById("btn-users").classList.remove("hidden");
            syncStudio();
        });

        function showTab(t) {
            ["reviews", "builder", "users"].forEach(id => {
                document.getElementById(`tab-${id}`).classList.toggle("hidden", id !== t);
            });
        }

        async function syncStudio() {
            const st = document.getElementById("status");
            st.textContent = "Syncing with Google Sheet...";
            const res = await fetch(APPS_SCRIPT_URL, { method: "POST", body: JSON.stringify({ action: "cms_fetch_dashboard", staffEmail: currentUser.email }) });
            const data = await res.json();
            if (data.status !== "success") { st.textContent = data.message; return; }

            st.textContent = `✓ Synced ${data.submissions.length} submissions & ${data.tracks.length} tracks.`;

            // Populate Course Dropdowns
            document.querySelectorAll(".course-sel").forEach(sel => {
                sel.innerHTML = data.tracks.map(t => `<option value="${t.id}">${t.title}</option>`).join("");
            });

            // Render Submissions
            const tbody = document.getElementById("tbody-subs");
            tbody.innerHTML = "";
            data.submissions.forEach(s => {
                tbody.innerHTML += `
                    <tr>
                        <td class="p-4 font-bold text-[var(--foreground)]">${s.name}<br><span class="font-normal text-[var(--muted-text)]">${s.email}</span></td>
                        <td class="p-4">${s.taskTitle}</td>
                        <td class="p-4"><a href="${s.link}" target="_blank" class="text-blue-500 underline">Open ↗</a></td>
                        <td class="p-4"><input type="text" id="rem-${s.rowIndex}" value="${s.remark}" placeholder="Remark..." class="px-2 py-1 rounded bg-[var(--muted-bg)] border border-white/10 text-[var(--foreground)]"></td>
                        <td class="p-4 space-x-1">
                            <span class="block mb-1 font-bold text-blue-400">${s.status}</span>
                            <button onclick="review(${s.rowIndex}, 'Approved')" class="px-2 py-1 rounded bg-emerald-600 text-white font-bold cursor-pointer">Approve</button>
                            <button onclick="review(${s.rowIndex}, 'Needs Revision')" class="px-2 py-1 rounded bg-amber-600 text-white font-bold cursor-pointer">Revise</button>
                        </td>
                    </tr>`;
            });

            // Render Users (Admin)
            if (isAdmin()) {
                const ubody = document.getElementById("tbody-users");
                ubody.innerHTML = "";
                data.users.forEach(u => {
                    ubody.innerHTML += `
                        <tr>
                            <td class="p-4 font-bold text-[var(--foreground)]">${u.name}</td>
                            <td class="p-4">${u.email}</td>
                            <td class="p-4">
                                <select onchange="setRole(${u.rowIndex}, this.value)" class="px-2 py-1 rounded bg-[var(--muted-bg)] border border-white/10 text-[var(--foreground)]">
                                    <option value="Student" ${u.role === "Student" ? "selected" : ""}>Student</option>
                                    <option value="Mentor" ${u.role === "Mentor" ? "selected" : ""}>Mentor</option>
                                    <option value="Admin" ${u.role === "Admin" ? "selected" : ""}>Admin</option>
                                </select>
                            </td>
                        </tr>`;
                });
            }
        }

        async function review(rowIndex, newStatus) {
            const remark = document.getElementById(`rem-${rowIndex}`).value.trim();
            await fetch(APPS_SCRIPT_URL, { method: "POST", body: JSON.stringify({ action: "cms_review_submission", staffEmail: currentUser.email, rowIndex, newStatus, remark }) });
            syncStudio();
        }

        async function setRole(rowIndex, newRole) {
            await fetch(APPS_SCRIPT_URL, { method: "POST", body: JSON.stringify({ action: "cms_update_user", staffEmail: currentUser.email, rowIndex, newRole }) });
            document.getElementById("status").textContent = "✓ Role updated!";
        }

        async function addCourse(e) {
            e.preventDefault();
            await fetch(APPS_SCRIPT_URL, { method: "POST", body: JSON.stringify({ action: "cms_add_course", staffEmail: currentUser.email, title: document.getElementById("c-title").value, category: document.getElementById("c-cat").value, techStack: document.getElementById("c-stack").value, description: document.getElementById("c-desc").value, isInternship: document.getElementById("c-intern").checked, requiresAccelerator: false }) });
            e.target.reset();
            syncStudio();
        }

        async function addLesson(e) {
            e.preventDefault();
            await fetch(APPS_SCRIPT_URL, { method: "POST", body: JSON.stringify({ action: "cms_add_lesson", staffEmail: currentUser.email, courseId: document.getElementById("l-course").value, title: document.getElementById("l-title").value, videoId: document.getElementById("l-video").value, resourceLink: document.getElementById("l-res").value, description: document.getElementById("l-desc").value }) });
            e.target.reset();
            syncStudio();
        }

        async function addTask(e) {
            e.preventDefault();
            await fetch(APPS_SCRIPT_URL, { method: "POST", body: JSON.stringify({ action: "cms_add_task", staffEmail: currentUser.email, courseId: document.getElementById("t-course").value, title: document.getElementById("t-title").value, deadline: document.getElementById("t-dead").value, instructions: document.getElementById("t-inst").value }) });
            e.target.reset();
            syncStudio();
        }
    </script>
</body>
</html>
