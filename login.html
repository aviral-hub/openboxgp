<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Login — Openbox Growth Partner</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <script src="shared.js"></script>
    <style>
        :root { --background: #f8fafc; --foreground: #0f172a; --muted-bg: #f1f5f9; --muted-text: #475569; --card: #ffffff; }
        .dark { --background: #0a0a0c; --foreground: #f8fafc; --muted-bg: #111115; --muted-text: #94a3b8; --card: #111115; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: var(--background); color: var(--muted-text); }
        .heading-font { font-family: 'Space Grotesk', sans-serif; }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-center items-center p-4 antialiased">

    <div class="w-full max-w-md mb-6 flex items-center justify-between">
        <a href="index.html" class="text-xs font-bold text-blue-500 hover:underline flex items-center gap-1.5">
            <i class="fa-solid fa-arrow-left"></i> Back to Home
        </a>
        <button id="theme-toggle" type="button" class="p-2 rounded-xl bg-[var(--muted-bg)] text-xs cursor-pointer" title="Toggle Theme">
            <i class="fa-solid fa-circle-half-stroke"></i>
        </button>
    </div>

    <div class="w-full max-w-md bg-[var(--card)] border border-slate-200 dark:border-white/10 rounded-2xl p-6 sm:p-8 shadow-2xl">
        <div class="flex items-center justify-between gap-2 mb-4">
            <div class="flex items-center gap-2">
                <span class="w-2 h-2 rounded-full bg-emerald-500"></span>
                <span class="text-xs font-bold uppercase tracking-widest text-blue-500">Openbox Unified Auth</span>
            </div>
            <span class="text-[10px] font-extrabold px-2.5 py-0.5 rounded-md bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">
                <i class="fa-solid fa-shield-check mr-1"></i> Password-Free
            </span>
        </div>

        <h1 class="heading-font text-2xl font-bold text-[var(--foreground)] mb-1">Welcome to Openbox</h1>
        <p class="text-xs text-[var(--muted-text)] mb-6">
            Sign in instantly with your Google account or enter your student details below—zero passwords required.
        </p>

        <!-- METHOD 1: OFFICIAL ONE-CLICK SIGN IN WITH GOOGLE -->
        <div class="mb-6">
            <div id="g_id_onload"
                 data-client_id="346521465461-cmjnljpddr5b128v9jheh3dl0t9dv0fu.apps.googleusercontent.com"
                 data-context="signin"
                 data-ux_mode="popup"
                 data-callback="handleGoogleCredential"
                 data-auto_prompt="false">
            </div>
            <div class="w-full flex justify-center">
                <div class="g_id_signin"
                     data-type="standard"
                     data-shape="pill"
                     data-theme="outline"
                     data-text="continue_with"
                     data-size="large"
                     data-width="360"
                     data-logo_alignment="left">
                </div>
            </div>
        </div>

        <div class="relative flex py-2 items-center mb-6">
            <div class="flex-grow border-t border-slate-200 dark:border-white/10"></div>
            <span class="flex-shrink mx-3 text-[11px] font-bold uppercase tracking-wider text-[var(--muted-text)]">Or Student Quick Access</span>
            <div class="flex-grow border-t border-slate-200 dark:border-white/10"></div>
        </div>

        <!-- METHOD 2: INSTANT STUDENT QUICK ACCESS -->
        <form onsubmit="handleInstantStudentLogin(event)" class="space-y-4">
            <div>
                <label for="inp-name" class="block text-xs font-semibold mb-1">Full Name (Printed on Certificate)</label>
                <input
                    type="text"
                    id="inp-name"
                    name="name"
                    autocomplete="name"
                    placeholder="Aviral Pathak"
                    required
                    class="w-full px-3.5 py-2.5 text-sm rounded-xl bg-[var(--muted-bg)] border border-slate-200 dark:border-white/10 text-[var(--foreground)] focus:outline-none focus:border-blue-500"
                />
            </div>

            <div>
                <label for="inp-email" class="block text-xs font-semibold mb-1">College or Personal Email</label>
                <input
                    type="email"
                    id="inp-email"
                    name="email"
                    autocomplete="email"
                    placeholder="20261076@dmims.edu.in"
                    required
                    class="w-full px-3.5 py-2.5 text-sm rounded-xl bg-[var(--muted-bg)] border border-slate-200 dark:border-white/10 text-[var(--foreground)] focus:outline-none focus:border-blue-500"
                />
            </div>

            <div>
                <label for="inp-gh" class="block text-xs font-semibold mb-1">GitHub / LinkedIn URL (Optional)</label>
                <input
                    type="url"
                    id="inp-gh"
                    name="github"
                    autocomplete="url"
                    placeholder="https://github.com/username"
                    class="w-full px-3.5 py-2.5 text-sm rounded-xl bg-[var(--muted-bg)] border border-slate-200 dark:border-white/10 text-[var(--foreground)] focus:outline-none focus:border-blue-500"
                />
            </div>

            <button type="submit" id="btn-instant-login" class="w-full py-3 rounded-xl text-xs font-extrabold bg-blue-600 hover:bg-blue-500 text-white shadow-lg cursor-pointer transition flex items-center justify-center gap-2">
                <span>Enter Learning Workspace</span>
                <i class="fa-solid fa-arrow-right"></i>
            </button>
        </form>

        <p id="auth-msg" class="mt-4 text-xs font-semibold text-center"></p>

        <div class="mt-6 pt-4 border-t border-slate-200 dark:border-white/10 text-[11px] text-[var(--muted-text)] flex items-center justify-between">
            <span><i class="fa-solid fa-lock text-emerald-500 mr-1"></i> Zero-password authentication</span>
            <a href="https://wa.me/917020729200?text=Hi%20Aviral,%20I%20need%20help%20accessing%20the%20Openbox%20portal." target="_blank" rel="noopener noreferrer" class="text-blue-500 hover:underline font-semibold">WhatsApp Help</a>
        </div>
    </div>

    <script>
        function completeSessionAndRedirect(data) {
            currentUser = data.user;
            localStorage.setItem("openbox_user", JSON.stringify(data.user));
            localStorage.setItem("openbox_progress", JSON.stringify(data.completedLessons || {}));
            localStorage.setItem("openbox_approved", JSON.stringify(data.approvedCourses || []));
            localStorage.setItem("openbox_submissions", JSON.stringify(data.mySubmissions || []));

            if (isStaff()) window.location.href = "studio.html";
            else window.location.href = "course.html";
        }

        // Handler 1: Google Identity Services Callback
        async function handleGoogleCredential(response) {
            const msg = document.getElementById("auth-msg");
            msg.textContent = "Verifying Google account...";
            msg.className = "mt-4 text-xs font-semibold text-center text-blue-400";

            try {
                const data = await postToOpenboxApi({
                    action: "google_signin",
                    credential: response.credential
                });

                if (data.status === "success") {
                    completeSessionAndRedirect(data);
                } else {
                    msg.textContent = data.message || "Google Sign-In failed.";
                    msg.className = "mt-4 text-xs font-semibold text-center text-red-400";
                }
            } catch (err) {
                msg.textContent = err.message || "Connection error.";
                msg.className = "mt-4 text-xs font-semibold text-center text-red-400";
            }
        }

        // Handler 2: Instant Student Access
        async function handleInstantStudentLogin(e) {
            e.preventDefault();
            const btn = document.getElementById("btn-instant-login");
            const msg = document.getElementById("auth-msg");

            const name = document.getElementById("inp-name").value.trim();
            const email = document.getElementById("inp-email").value.trim();
            const github = document.getElementById("inp-gh").value.trim();

            btn.disabled = true;
            btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> <span>Loading Workspace...</span>`;
            msg.textContent = "";

            try {
                const data = await postToOpenboxApi({
                    action: "instant_signin",
                    name: name,
                    email: email,
                    github: github
                });

                if (data.status === "success") {
                    completeSessionAndRedirect(data);
                } else {
                    msg.textContent = data.message || "Could not sign in.";
                    msg.className = "mt-4 text-xs font-semibold text-center text-red-400";
                }
            } catch (err) {
                msg.textContent = err.message || "Connection error.";
                msg.className = "mt-4 text-xs font-semibold text-center text-red-400";
            } finally {
                btn.disabled = false;
                btn.innerHTML = `<span>Enter Learning Workspace</span> <i class="fa-solid fa-arrow-right"></i>`;
            }
        }
    </script>
</body>
</html>
