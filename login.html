<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Login — Openbox Growth Partner</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <script src="shared.js"></script>
    <style>
        :root { --background: #f8fafc; --foreground: #0f172a; --muted-bg: #f1f5f9; --muted-text: #475569; --card: #ffffff; }
        .dark { --background: #0a0a0c; --foreground: #f8fafc; --muted-bg: #111115; --muted-text: #94a3b8; --card: #111115; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: var(--background); color: var(--muted-text); }
        .heading-font { font-family: 'Space Grotesk', sans-serif; }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-center items-center p-4 antialiased">

    <div class="w-full max-w-md mb-6 flex items-center justify-between">
        <a href="index.html" class="text-xs font-bold text-blue-500 hover:underline flex items-center gap-1.5">
            <i class="fa-solid fa-arrow-left"></i> Back to Home
        </a>
        <button id="theme-toggle" type="button" class="p-2 rounded-xl bg-[var(--muted-bg)] text-xs cursor-pointer" title="Toggle Theme">
            <i class="fa-solid fa-circle-half-stroke"></i>
        </button>
    </div>

    <div class="w-full max-w-md bg-[var(--card)] border border-slate-200 dark:border-white/10 rounded-2xl p-6 sm:p-8 shadow-2xl">
        <div class="flex items-center justify-between gap-2 mb-4">
            <div class="flex items-center gap-2">
                <span class="w-2 h-2 rounded-full bg-emerald-500"></span>
                <span class="text-xs font-bold uppercase tracking-widest text-blue-500">Openbox Unified Auth</span>
            </div>
            <span class="text-[10px] font-extrabold px-2.5 py-0.5 rounded-md bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">
                <i class="fa-solid fa-shield-check mr-1"></i> Passwordless OTP
            </span>
        </div>

        <h1 class="heading-font text-2xl font-bold text-[var(--foreground)] mb-1">Welcome to Openbox</h1>
        <p class="text-xs text-[var(--muted-text)] mb-6">
            Enter your email to receive a 6-digit verification code. Student, Mentor, and Admin roles are detected automatically.
        </p>

        <!-- Mode Tabs -->
        <div class="grid grid-cols-2 gap-2 p-1 rounded-xl bg-[var(--muted-bg)] mb-6">
            <button id="tab-login" type="button" onclick="setMode('login')" class="py-2 rounded-lg text-xs font-bold bg-[var(--card)] text-[var(--foreground)] shadow-sm cursor-pointer">
                Quick Login
            </button>
            <button id="tab-register" type="button" onclick="setMode('register')" class="py-2 rounded-lg text-xs font-bold text-[var(--muted-text)] cursor-pointer">
                New Student Setup
            </button>
        </div>

        <!-- STEP 1: EMAIL & OPTIONAL PROFILE DETAILS -->
        <form id="step-email-form" onsubmit="requestOtp(event)" class="space-y-4">
            <div id="wrap-name" class="hidden">
                <label for="inp-name" class="block text-xs font-semibold mb-1">Full Name (Printed on Certificate)</label>
                <input
                    type="text"
                    id="inp-name"
                    name="name"
                    autocomplete="name"
                    placeholder="Aviral Pathak"
                    class="w-full px-3.5 py-2.5 text-sm rounded-xl bg-[var(--muted-bg)] border border-slate-200 dark:border-white/10 text-[var(--foreground)] focus:outline-none focus:border-blue-500"
                />
            </div>

            <div>
                <label for="inp-email" class="block text-xs font-semibold mb-1">Email Address</label>
                <input
                    type="email"
                    id="inp-email"
                    name="email"
                    autocomplete="email"
                    placeholder="you@example.com"
                    required
                    class="w-full px-3.5 py-2.5 text-sm rounded-xl bg-[var(--muted-bg)] border border-slate-200 dark:border-white/10 text-[var(--foreground)] focus:outline-none focus:border-blue-500"
                />
            </div>

            <div id="wrap-gh" class="hidden">
                <label for="inp-gh" class="block text-xs font-semibold mb-1">GitHub Profile URL (Optional)</label>
                <input
                    type="url"
                    id="inp-gh"
                    name="github"
                    autocomplete="url"
                    placeholder="https://github.com/username"
                    class="w-full px-3.5 py-2.5 text-sm rounded-xl bg-[var(--muted-bg)] border border-slate-200 dark:border-white/10 text-[var(--foreground)] focus:outline-none focus:border-blue-500"
                />
            </div>

            <button type="submit" id="btn-send-otp" class="w-full py-3 rounded-xl text-xs font-extrabold bg-blue-600 hover:bg-blue-500 text-white shadow-lg cursor-pointer transition flex items-center justify-center gap-2">
                <span>Send 6-Digit Login Code</span>
                <i class="fa-solid fa-paper-plane"></i>
            </button>
        </form>

        <!-- STEP 2: 6-DIGIT OTP VERIFICATION -->
        <form id="step-otp-form" onsubmit="verifyOtp(event)" class="hidden space-y-4">
            <div class="p-3.5 rounded-xl bg-blue-500/10 border border-blue-500/20 flex items-center justify-between gap-2">
                <div class="text-xs">
                    <span class="text-[var(--muted-text)] block">Code sent to:</span>
                    <strong id="sent-email-display" class="text-[var(--foreground)]"></strong>
                </div>
                <button type="button" onclick="resetToEmailStep()" class="text-[11px] font-bold text-blue-500 hover:underline cursor-pointer shrink-0">
                    Change Email
                </button>
            </div>

            <div>
                <div class="flex items-center justify-between mb-1">
                    <label for="inp-otp" class="block text-xs font-semibold">Enter 6-Digit Verification Code</label>
                    <span id="otp-timer" class="text-[11px] font-mono font-bold text-amber-400">10:00</span>
                </div>
                <input
                    type="text"
                    id="inp-otp"
                    inputmode="numeric"
                    pattern="[0-9]{6}"
                    maxlength="6"
                    autocomplete="one-time-code"
                    placeholder="••••••"
                    required
                    class="w-full px-4 py-3 text-center text-xl font-mono font-extrabold tracking-[0.5em] rounded-xl bg-[var(--muted-bg)] border border-slate-200 dark:border-white/10 text-[var(--foreground)] focus:outline-none focus:border-blue-500"
                />
            </div>

            <button type="submit" id="btn-verify-otp" class="w-full py-3 rounded-xl text-xs font-extrabold bg-emerald-600 hover:bg-emerald-500 text-white shadow-lg cursor-pointer transition flex items-center justify-center gap-2">
                <i class="fa-solid fa-circle-check"></i>
                <span>Verify &amp; Enter Workspace</span>
            </button>

            <div class="text-center">
                <button type="button" id="btn-resend-otp" onclick="requestOtp(event)" class="text-xs font-bold text-blue-500 hover:underline cursor-pointer">
                    Didn't receive it? Resend Code
                </button>
            </div>
        </form>

        <p id="auth-msg" class="mt-4 text-xs font-semibold text-center"></p>

        <div class="mt-6 pt-4 border-t border-slate-200 dark:border-white/10 text-[11px] text-[var(--muted-text)] flex items-center justify-between">
            <span><i class="fa-solid fa-lock text-emerald-500 mr-1"></i> Zero-password email verification</span>
            <a href="https://wa.me/917020729200?text=Hi%20Aviral,%20I%20am%20not%20receiving%20my%20Openbox%20OTP%20code." target="_blank" rel="noopener noreferrer" class="text-blue-500 hover:underline font-semibold">Need Help?</a>
        </div>
    </div>

    <script>
        let mode = "login";
        let otpCountdown = null;

        function setMode(m) {
            mode = m;
            const isSignup = m === "register";
            document.getElementById("wrap-name").classList.toggle("hidden", !isSignup);
            document.getElementById("wrap-gh").classList.toggle("hidden", !isSignup);

            document.getElementById("tab-login").className = !isSignup
                ? "py-2 rounded-lg text-xs font-bold bg-[var(--card)] text-[var(--foreground)] shadow-sm cursor-pointer"
                : "py-2 rounded-lg text-xs font-bold text-[var(--muted-text)] cursor-pointer";
            document.getElementById("tab-register").className = isSignup
                ? "py-2 rounded-lg text-xs font-bold bg-[var(--card)] text-[var(--foreground)] shadow-sm cursor-pointer"
                : "py-2 rounded-lg text-xs font-bold text-[var(--muted-text)] cursor-pointer";
        }

        function startOtpCountdown(seconds = 600) {
            clearInterval(otpCountdown);
            let remaining = seconds;
            const timerEl = document.getElementById("otp-timer");
            otpCountdown = setInterval(() => {
                remaining--;
                if (remaining <= 0) {
                    clearInterval(otpCountdown);
                    timerEl.textContent = "Expired";
                    return;
                }
                const m = String(Math.floor(remaining / 60)).padStart(2, "0");
                const s = String(remaining % 60).padStart(2, "0");
                timerEl.textContent = `${m}:${s}`;
            }, 1000);
        }

        function resetToEmailStep() {
            clearInterval(otpCountdown);
            document.getElementById("step-otp-form").classList.add("hidden");
            document.getElementById("step-email-form").classList.remove("hidden");
            document.getElementById("auth-msg").textContent = "";
        }

        async function requestOtp(e) {
            if (e) e.preventDefault();
            const email = document.getElementById("inp-email").value.trim();
            const msg = document.getElementById("auth-msg");
            const sendBtn = document.getElementById("btn-send-otp");
            const resendBtn = document.getElementById("btn-resend-otp");

            if (!email) {
                msg.textContent = "Please enter your email address first.";
                msg.className = "mt-4 text-xs font-semibold text-center text-red-400";
                return;
            }

            sendBtn.disabled = true;
            sendBtn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> <span>Sending Code...</span>`;
            if (resendBtn) resendBtn.disabled = true;
            msg.textContent = "";

            try {
                const res = await fetch(APPS_SCRIPT_URL, {
                    method: "POST",
                    body: JSON.stringify({
                        action: "send_otp",
                        email: email
                    })
                });
                const data = await res.json();

                if (data.status === "success") {
                    document.getElementById("sent-email-display").textContent = email;
                    document.getElementById("step-email-form").classList.add("hidden");
                    document.getElementById("step-otp-form").classList.remove("hidden");
                    document.getElementById("inp-otp").value = "";
                    document.getElementById("inp-otp").focus();

                    msg.textContent = "✓ 6-digit verification code sent! Check your Inbox or Spam folder.";
                    msg.className = "mt-4 text-xs font-semibold text-center text-emerald-400";
                    startOtpCountdown(600);
                } else {
                    msg.textContent = data.message || "Could not send verification code.";
                    msg.className = "mt-4 text-xs font-semibold text-center text-red-400";
                }
            } catch (err) {
                msg.textContent = "Network error. Verify APPS_SCRIPT_URL in shared.js.";
                msg.className = "mt-4 text-xs font-semibold text-center text-red-400";
            } finally {
                sendBtn.disabled = false;
                sendBtn.innerHTML = `<span>Send 6-Digit Login Code</span> <i class="fa-solid fa-paper-plane"></i>`;
                if (resendBtn) resendBtn.disabled = false;
            }
        }

        async function verifyOtp(e) {
            e.preventDefault();
            const btn = document.getElementById("btn-verify-otp");
            const msg = document.getElementById("auth-msg");

            const email = document.getElementById("inp-email").value.trim();
            const otp = document.getElementById("inp-otp").value.trim();
            const name = document.getElementById("inp-name").value.trim();
            const github = document.getElementById("inp-gh").value.trim();

            btn.disabled = true;
            btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> <span>Verifying Code...</span>`;
            msg.textContent = "";

            try {
                const res = await fetch(APPS_SCRIPT_URL, {
                    method: "POST",
                    body: JSON.stringify({
                        action: "verify_otp",
                        email: email,
                        otp: otp,
                        name: name,
                        github: github
                    })
                });
                const data = await res.json();

                if (data.status === "success") {
                    clearInterval(otpCountdown);
                    currentUser = data.user;
                    localStorage.setItem("openbox_user", JSON.stringify(data.user));
                    localStorage.setItem("openbox_progress", JSON.stringify(data.completedLessons || {}));
                    localStorage.setItem("openbox_approved", JSON.stringify(data.approvedCourses || []));
                    localStorage.setItem("openbox_submissions", JSON.stringify(data.mySubmissions || []));

                    // Redirect based on role
                    if (isStaff()) window.location.href = "studio.html";
                    else window.location.href = "course.html";
                } else {
                    msg.textContent = data.message || "Invalid or expired OTP code.";
                    msg.className = "mt-4 text-xs font-semibold text-center text-red-400";
                }
            } catch (err) {
                msg.textContent = "Network error. Check APPS_SCRIPT_URL in shared.js.";
                msg.className = "mt-4 text-xs font-semibold text-center text-red-400";
            } finally {
                btn.disabled = false;
                btn.innerHTML = `<i class="fa-solid fa-circle-check"></i> <span>Verify &amp; Enter Workspace</span>`;
            }
        }
    </script>
</body>
</html>
